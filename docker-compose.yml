services:
  bot:
    container_name: bot
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env  
    depends_on:
      - evolution-api
      - redis

  evolution-api:
    container_name: evolution-api
    image: evoapicloud/evolution-api:latest
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis

  postgres:
    container_name: postgres
    image: postgres:15
    command: ["postgres", "-c", "max_connections=1000"]
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - 5432    

  redis:
    image: redis:latest
    container_name: redis
    command: >
      redis-server --port 6379 --appendonly yes
    volumes:
      - redis:/data
    ports:
      - 6379:6379
    


volumes:
  evolution_instances:
  postgres_data:
  redis:
